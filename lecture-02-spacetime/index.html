<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />

<title>Lecture 2: Special Relativity: Spacetime Geometry — ASTR 3900/8090</title>
<style>
:root{--bg:#FBFBF8;--panel:#EDF1F6;--ink:#15243C;--blue:#0F6E93;--blued:#2E6DA4;--brown:#8A5A18;--grey:#5A6B7B;--mute2:#33465C;--dim:#C4CBD8;--red:#A43B34;--green:#2E7D57}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
.wrap{max-width:1200px;margin:0 auto;padding:24px 28px 40px}
.eyebrow{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--blue);margin:0 0 6px}
h1{font-family:Georgia,"Times New Roman",serif;font-weight:400;font-size:30px;margin:0 0 8px;color:var(--ink)}
.sub{font-size:14px;line-height:1.5;color:var(--grey);margin:0}
footer{margin-top:24px;padding:14px 0 0;border-top:1px solid var(--dim);font-size:11.5px;color:var(--grey);display:flex;justify-content:space-between;flex-wrap:wrap;gap:6px}

/* ---- component kit (STYLE_GUIDE §14.1) ---- */
.tabs{display:flex;flex-wrap:wrap;gap:8px;margin:16px 0 0}
.tabs button{font:600 13.5px/1.2 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  padding:9px 14px;border:1px solid var(--dim);border-radius:8px;background:#fff;color:var(--ink);cursor:pointer}
.tabs button:hover{border-color:var(--blued)}
.tabs button.active{background:var(--blue);border-color:var(--blue);color:#fff}
.btn{font:600 13px/1.2 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  padding:8px 14px;border-radius:8px;border:1px solid var(--blued);background:#fff;color:var(--blued);cursor:pointer}
.btn:hover{background:var(--panel)}
.btn.primary{background:var(--blued);color:#fff}
.btn.primary:hover{background:var(--blue)}
.btn:disabled{opacity:.45;cursor:default}
.btnrow{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
input[type=range]{width:100%;accent-color:var(--blue);margin:2px 0 0}
.ctl{margin:0 0 12px}
.ctl:last-child{margin-bottom:0}
.ctl label{display:block;font-size:12.5px;color:var(--mute2)}
.ctl .val{float:right;font-family:"SF Mono","Cascadia Code",Consolas,"Courier New",monospace;font-size:12.5px;color:var(--blue)}

main{display:grid;grid-template-columns:minmax(480px,1fr) 370px;gap:16px;padding-top:16px}
@media(max-width:980px){main{grid-template-columns:1fr}}
/* Cropped canvas (STYLE_GUIDE §9): logical 1100x1050, visible rows y = 85..750
   (t from -1.8 to 7.43 at the default scale).  margin-top = 85/1100. */
.canvasWrap{background:#fff;border:1px solid var(--dim);border-radius:12px;padding:8px;overflow:hidden;aspect-ratio:1100/665}
.canvasWrap canvas{width:100%;height:auto;aspect-ratio:1100/1050;display:block;margin-top:-7.73%;touch-action:none}
aside{display:flex;flex-direction:column;gap:12px}
.panel{background:var(--panel);border:1px solid var(--dim);border-radius:10px;padding:14px 16px}
.panel h2{font-family:Georgia,serif;font-size:17px;font-weight:400;margin:0 0 10px;color:var(--ink)}
.readout{display:grid;grid-template-columns:1fr auto;gap:3px 12px;font-size:13px;margin-top:8px}
.readout .v{font-family:"SF Mono","Cascadia Code",Consolas,"Courier New",monospace;font-weight:600;text-align:right}
.prompt{border-left:4px solid var(--blue);padding-left:10px;font-size:13.5px;line-height:1.45}
.hint{font-size:12.5px;color:var(--grey);line-height:1.45;margin-top:6px}
.col{display:flex;flex-direction:column;gap:10px}
.relbar{background:var(--panel);border:1px solid var(--dim);border-radius:10px;padding:9px 14px;display:block;line-height:1.5}
.relbar .rl{font-size:11px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--grey);margin-right:12px}
.eq{font-family:Georgia,"Times New Roman",serif;font-size:15.5px;color:var(--ink)}
.spacelike{color:var(--blue)}.null{color:var(--red)}.timelike{color:var(--green)}
</style>

<body>
<div class="wrap">
<header>
<div class="eyebrow">ASTR 3900/8090 · Lecture 2</div>
<h1>Special Relativity: Spacetime Geometry</h1>
<div class="sub">Intervals, boosts, twins and rapidity on one Minkowski diagram (c = 1), calibrated by hyperbolae of constant interval.</div>
</header>
<div class="tabs">
<button class="active" data-mode="interval">1. Interval &amp; light cone</button>
<button data-mode="boost">2. Boost &amp; rod length</button>
<button data-mode="twin">3. Twin proper time</button>
<button data-mode="velocity">4. Velocity &amp; rapidity</button>
</div>
<main>
<div class="col">
<div class="canvasWrap"><canvas id="c" width="1100" height="1050"></canvas></div>
<div class="relbar"><span class="rl">Lecture relation</span><span class="eq" id="eq"></span></div>
</div>
<aside>
<div class="panel" id="controls"></div>
<div class="panel"><h2>Explore</h2><div class="prompt" id="prompt"></div><div class="hint" id="hint"></div></div>
</aside>
</main>
<footer><span>S. Taylor · Vanderbilt University</span><span>ASTR 3900/8090 · Lecture 2</span></footer>
</div>
<script>
(function(){
"use strict";
// ---------- kit helpers (STYLE_GUIDE §14) ----------
function hidpi(cv, W, H){
  var dpr = Math.min(window.devicePixelRatio || 1, 3);
  cv.width = Math.round(W*dpr); cv.height = Math.round(H*dpr);
  var c = cv.getContext('2d');
  c.setTransform(dpr, 0, 0, dpr, 0, 0);
  return c;
}
function mtext(ctx, x, y, base, sub, sup, size, col, align){
  size = size || 15; col = col || '#15243C';
  var fb = 'italic ' + size + 'px Georgia,"Times New Roman",serif';
  var fs = Math.round(size*0.68) + 'px Georgia,"Times New Roman",serif';
  ctx.save(); ctx.fillStyle = col; ctx.textBaseline = 'alphabetic'; ctx.textAlign = 'left';
  ctx.font = fb; var wb = ctx.measureText(base).width;
  ctx.font = fs; var ws = Math.max(sub ? ctx.measureText(sub).width : 0, sup ? ctx.measureText(sup).width : 0);
  var x0 = align === 'center' ? x - (wb+ws)/2 : align === 'right' ? x - wb - ws : x;
  ctx.font = fb; ctx.fillText(base, x0, y);
  ctx.font = fs;
  if(sub) ctx.fillText(sub, x0 + wb + 1, y + size*0.28);
  if(sup) ctx.fillText(sup, x0 + wb + 1, y - size*0.42);
  ctx.restore(); return wb + ws;
}

var LW = 1100, LH = 1050;
var canvas = document.getElementById('c'), ctx = hidpi(canvas, LW, LH);
var controls = document.getElementById('controls'), promptEl = document.getElementById('prompt'),
    hintEl = document.getElementById('hint'), eqEl = document.getElementById('eq');
var C = {ink:'#15243C', muted:'#5A6B7B', red:'#A43B34', green:'#2E7D57', blue:'#0F6E93',
         orange:'#8A5A18', grid:'#E7EBF2', hyp:'#B9C3D3', dim:'#C4CBD8'};
var SANS = '-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif';

// ---------- state ----------
var mode = 'interval';
var beta = 0.60;          // boost used by the interval and boost tabs
var bTwin = 0.60, T = 6, tc = 0;
var vx = 0.75, V = 0.45;
var q = {x:3.2, t:2.0}, dragging = false;
var playing = false, anim = null, lastNow = 0, phase = 0;

// Views.  The visible band of the cropped canvas is logical y = 85..750;
// every box below maps inside it (checked in verify notes at the bottom).
var VIEW_MAIN = {cx:520, cy:620, scale:72,  X:7.0, Tlo:-1.5, Thi:7.2};
var VIEW_VEL  = {cx:520, cy:620, scale:130, X:3.8, Tlo:-0.8, Thi:4.0};
var view = VIEW_MAIN;

function W(x,t){ return {x:view.cx + x*view.scale, y:view.cy - t*view.scale}; }
function inv(px,py){ return {x:(px - view.cx)/view.scale, t:(view.cy - py)/view.scale}; }
function gamma(b){ return 1/Math.sqrt(1 - b*b); }
function clamp(n,a,b){ return Math.max(a, Math.min(b, n)); }
function f2(v){ return (Math.abs(v) < 5e-4 ? 0 : v).toFixed(2); }
function f3(v){ return (Math.abs(v) < 5e-5 ? 0 : v).toFixed(3); }

// ---------- drawing primitives ----------
function line(p, r, color, width, dash){
  ctx.save(); ctx.strokeStyle = color || C.ink; ctx.lineWidth = width || 2; ctx.setLineDash(dash || []);
  ctx.beginPath(); ctx.moveTo(p.x, p.y); ctx.lineTo(r.x, r.y); ctx.stroke(); ctx.restore();
}
function arrowHead(p, r, color){
  var a = Math.atan2(r.y - p.y, r.x - p.x);
  ctx.save(); ctx.fillStyle = color; ctx.translate(r.x, r.y); ctx.rotate(a);
  ctx.beginPath(); ctx.moveTo(0,0); ctx.lineTo(-11,4.5); ctx.lineTo(-11,-4.5); ctx.closePath(); ctx.fill(); ctx.restore();
}
function arrow(p, r, color, width, dash){ line(p, r, color, width, dash); arrowHead(p, r, color); }
function dot(p, color, r, ring){
  ctx.save(); ctx.fillStyle = color; ctx.beginPath(); ctx.arc(p.x, p.y, r || 6, 0, 2*Math.PI); ctx.fill();
  if(ring){ ctx.strokeStyle = '#fff'; ctx.lineWidth = 1.6; ctx.stroke(); }
  ctx.restore();
}
// Canvas text displays at ~0.67x (1100 logical px in a ~740 px column), so sizes are
// scaled up and floored at 17 logical px (>= 11 CSS px).  A light knock-out keeps
// labels legible over the grid and hyperbolae.
function text(s, p, color, size, align, weight, noKnock){
  var fs = Math.max(17, Math.round((size || 14)*1.35));
  ctx.save(); ctx.font = (weight ? weight + ' ' : '') + fs + 'px ' + SANS;
  ctx.textAlign = align || 'left'; ctx.textBaseline = 'middle';
  if(!noKnock){
    var w = ctx.measureText(s).width, x0 = ctx.textAlign === 'center' ? p.x - w/2 : ctx.textAlign === 'right' ? p.x - w : p.x;
    ctx.fillStyle = 'rgba(255,255,255,0.88)'; ctx.fillRect(x0 - 3, p.y - fs*0.62, w + 6, fs*1.24);
  }
  ctx.fillStyle = color || C.ink; ctx.fillText(s, p.x, p.y); ctx.restore();
}
function boxClip(){
  var a = W(-view.X, view.Thi), b = W(view.X, view.Tlo);
  ctx.beginPath(); ctx.rect(a.x, a.y, b.x - a.x, b.y - a.y); ctx.clip();
}
function inBox(x,t){ return x >= -view.X && x <= view.X && t >= view.Tlo && t <= view.Thi; }
// Liang-Barsky: parameter range of (x0,t0)+s(dx,dt) inside the view box
function clipRange(x0, t0, dx, dt){
  var lo = -Infinity, hi = Infinity, B = [[x0,dx,-view.X,view.X],[t0,dt,view.Tlo,view.Thi]];
  for(var i=0;i<2;i++){
    var p = B[i][0], d = B[i][1], a = B[i][2], b = B[i][3];
    if(Math.abs(d) < 1e-12){ if(p < a || p > b) return null; continue; }
    var s1 = (a - p)/d, s2 = (b - p)/d; if(s1 > s2){ var tmp = s1; s1 = s2; s2 = tmp; }
    lo = Math.max(lo, s1); hi = Math.min(hi, s2);
  }
  return lo <= hi ? [lo, hi] : null;
}
function polyline(pts, color, width, dash){
  ctx.save(); ctx.strokeStyle = color; ctx.lineWidth = width; ctx.setLineDash(dash || []);
  ctx.beginPath(); var pen = false;
  for(var i=0;i<pts.length;i++){
    var P = pts[i];
    if(!P || !inBox(P[0], P[1])){ pen = false; continue; }
    var s = W(P[0], P[1]); if(pen) ctx.lineTo(s.x, s.y); else { ctx.moveTo(s.x, s.y); pen = true; }
  }
  ctx.stroke(); ctx.restore();
}
// Hyperbola -(ct)^2 + x^2 = s2 (all branches), sampled in the hyperbolic angle.
function hyperbola(s2, color, width, dash){
  var a = Math.sqrt(Math.abs(s2)), sgnList = [1,-1];
  for(var k=0;k<2;k++){
    var sg = sgnList[k], pts = [];
    for(var e=-3.2; e<=3.2001; e+=0.01){
      if(s2 < 0) pts.push([a*Math.sinh(e), sg*a*Math.cosh(e)]);
      else       pts.push([sg*a*Math.cosh(e), a*Math.sinh(e)]);
    }
    polyline(pts, color, width, dash);
  }
}

// ---------- scene pieces ----------
function background(){
  ctx.clearRect(0, 0, LW, LH);
  ctx.fillStyle = '#FFFFFF'; ctx.fillRect(0, 0, LW, LH);
  ctx.save(); boxClip();
  ctx.strokeStyle = C.grid; ctx.lineWidth = 1;
  for(var x = Math.ceil(-view.X); x <= view.X; x++){ var p = W(x, view.Tlo), r = W(x, view.Thi); ctx.beginPath(); ctx.moveTo(p.x,p.y); ctx.lineTo(r.x,r.y); ctx.stroke(); }
  for(var t = Math.ceil(view.Tlo); t <= view.Thi; t++){ var p2 = W(-view.X, t), r2 = W(view.X, t); ctx.beginPath(); ctx.moveTo(p2.x,p2.y); ctx.lineTo(r2.x,r2.y); ctx.stroke(); }
  ctx.restore();
}
function unprimedAxes(){
  arrow(W(-view.X - 0.15, 0), W(view.X + 0.15, 0), C.ink, 1.8);
  arrow(W(0, view.Tlo), W(0, view.Thi + 0.1), C.ink, 1.8);
  mtext(ctx, W(view.X + 0.1, 0).x - 4, W(0,0).y - 12, 'x', null, null, 25, C.ink, 'right');
  mtext(ctx, W(0,0).x + 12, W(0, view.Thi).y + 12, 'ct', null, null, 25, C.ink, 'left');
  // integer ticks
  ctx.save(); ctx.strokeStyle = C.muted; ctx.lineWidth = 1.2;
  for(var k = Math.ceil(-view.X + 0.5); k <= view.X - 0.5; k++){ if(!k) continue; var p = W(k,0); ctx.beginPath(); ctx.moveTo(p.x, p.y - 4); ctx.lineTo(p.x, p.y + 4); ctx.stroke(); }
  for(var j = 1; j <= view.Thi - 0.5; j++){ var s = W(0,j); ctx.beginPath(); ctx.moveTo(s.x - 4, s.y); ctx.lineTo(s.x + 4, s.y); ctx.stroke(); }
  ctx.restore();
}
function lightCone(label){
  ctx.save(); boxClip();
  var L = Math.max(view.X, view.Thi) + 2;
  line(W(-L, L), W(L, -L), C.red, 1.8, [8,7]); line(W(L, L), W(-L, -L), C.red, 1.8, [8,7]);
  ctx.restore();
}
// drawn last so its knock-out sits above every curve
function lightConeLabel(){ var p = W(Math.min(view.Thi, view.X) - 1.3, Math.min(view.Thi, view.X) - 1.0); text('light cone', {x:p.x + 8, y:p.y}, C.red, 12.5); }
function calibrationHyperbolae(){
  ctx.save(); boxClip();
  [1,4,9,16,25,36].forEach(function(s2){ hyperbola(-s2, C.hyp, 1, []); hyperbola(s2, C.hyp, 1, []); });
  ctx.restore();
}
function tickAt(P, dirScreen, color, len, label, labOff){
  var n = {x:-dirScreen.y, y:dirScreen.x};
  ctx.save(); ctx.strokeStyle = color; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(P.x - n.x*len, P.y - n.y*len); ctx.lineTo(P.x + n.x*len, P.y + n.y*len); ctx.stroke(); ctx.restore();
  if(label) text(label, {x:P.x + n.x*labOff, y:P.y + n.y*labOff}, color, 12.5, 'center', '600');
}
// Boosted axes with unit ticks where the calibration hyperbolae cross them:
// ct' = k lands at k*gamma*(beta, 1); x' = k lands at k*gamma*(1, beta).
function primedAxes(b, color){
  var g = gamma(b);
  ctx.save(); boxClip();
  var rx = clipRange(0, 0, 1, b), rt = clipRange(0, 0, b, 1);
  line(W(rx[0], rx[0]*b), W(rx[1], rx[1]*b), color, 2.6);
  line(W(rt[0]*b, rt[0]), W(rt[1]*b, rt[1]), color, 2.6);
  var sx = norm(W(1, b), W(0,0)), st = norm(W(b, 1), W(0,0));
  for(var k=-8; k<=8; k++){
    if(!k) continue;
    if(inBox(k*g, k*g*b)) tickAt(W(k*g, k*g*b), sx, color, 7, (k > 0 && k <= 5 ? String(k) : ''), 19);
    if(inBox(k*g*b, k*g)) tickAt(W(k*g*b, k*g), st, color, 7, (k > 0 && k <= 5 ? String(k) : ''), -19);
  }
  ctx.restore();
  // axis heads + labels, placed just inside the box ends
  var ex = W(rx[1]*0.97, rx[1]*0.97*b), et = W(rt[1]*0.97*b, rt[1]*0.97);
  arrowHead(W(0,0), ex, color); arrowHead(W(0,0), et, color);
  text("x′", {x:ex.x - 8, y:ex.y + (b >= 0 ? 24 : -24)}, color, 17, 'right', '600');
  text("ct′", {x:et.x + 14, y:et.y + 8}, color, 17, 'left', '600');
}
function norm(a, o){ var dx = a.x - o.x, dy = a.y - o.y, L = Math.hypot(dx, dy); return {x:dx/L, y:dy/L}; }

// ---------- tab 1: interval ----------
function drawInterval(){
  view = VIEW_MAIN; background(); calibrationHyperbolae(); lightCone(true); unprimedAxes();
  var ds2 = q.x*q.x - q.t*q.t, cls = 'spacelike', col = C.blue;
  if(Math.abs(ds2) < 0.12){ cls = 'null'; col = C.red; } else if(ds2 < 0){ cls = 'timelike'; col = C.green; }
  if(cls !== 'null'){ ctx.save(); boxClip(); hyperbola(ds2, col, 2.2, [6,5]); ctx.restore(); }
  primedAxes(beta, C.orange);
  var g = gamma(beta), tp = g*(q.t - beta*q.x), xp = g*(q.x - beta*q.t);
  // read Q's primed coordinates: lines through Q parallel to each primed axis
  ctx.save(); boxClip();
  var A = W(tp*g*beta, tp*g), B = W(xp*g, xp*g*beta), P = W(q.x, q.t);
  line(P, A, C.orange, 1.4, [4,4]); line(P, B, C.orange, 1.4, [4,4]);
  dot(A, C.orange, 3.5); dot(B, C.orange, 3.5);
  ctx.restore();
  line(W(0,0), P, col, 3);
  dot(W(0,0), C.ink, 5); text('P', {x:W(0,0).x - 14, y:W(0,0).y + 14}, C.ink, 14);
  dot(P, col, 9, true);
  text('Q', {x:P.x + 14, y:P.y - 12}, col, 15, 'left', '700');
  text('drag Q', {x:P.x + 14, y:P.y + 10}, C.muted, 12);
  if(cls !== 'null'){
    var lab = ds2 < 0 ? W(0.7, Math.sqrt(0.49 - ds2)) : W(Math.sqrt(ds2 + 0.36)*(q.x >= 0 ? 1 : -1), 0.6);
    if(inBox((lab.x - view.cx)/view.scale, (view.cy - lab.y)/view.scale)) text('Δs² = const', {x:lab.x + 8, y:lab.y - 10}, col, 12);
  }
  lightConeLabel();
  set('rdx', f2(q.x)); set('rdt', f2(q.t)); set('rds', f2(ds2));
  var cl = document.getElementById('rcl'); cl.textContent = cls; cl.className = 'v ' + cls;
  set('rdxp', f2(xp)); set('rdtp', f2(tp)); set('rdsp', f2(xp*xp - tp*tp));
}
function buildInterval(){
  controls.innerHTML = '<h2>Interval readout</h2>' +
    '<div class="ctl"><label>boost β = v/c of O′ <span class="val" id="bv"></span></label>' +
    '<input id="br" type="range" min="-0.90" max="0.90" step="0.01"></div>' +
    '<div class="readout">' +
    '<span>Δx</span><span class="v" id="rdx"></span><span>cΔt</span><span class="v" id="rdt"></span>' +
    '<span>Δx′</span><span class="v" id="rdxp"></span><span>cΔt′</span><span class="v" id="rdtp"></span>' +
    '<span>Δs² from (Δx, cΔt)</span><span class="v" id="rds"></span><span>Δs² from (Δx′, cΔt′)</span><span class="v" id="rdsp"></span>' +
    '<span>classification</span><span class="v" id="rcl"></span></div>' +
    '<div class="btnrow"><button class="btn" id="resetQ">Reset event</button></div>';
  bindBeta();
  document.getElementById('resetQ').onclick = function(){ q = {x:3.2, t:2.0}; draw(); };
  promptEl.textContent = 'Drag Q across the light cone; its class changes only at the null boundary. Then move β: Q’s primed coordinates change, but Q stays on its dashed hyperbola.';
  hintEl.textContent = 'Dashed lines through Q run parallel to the primed axes; read Δx′ and cΔt′ off the ticks, which sit where the hyperbolae cross each axis.';
  eqEl.innerHTML = 'Δs² = −(cΔt)² + Δx² = −(cΔt′)² + (Δx′)²';
}

// ---------- tab 2: boost ----------
function drawBoost(){
  view = VIEW_MAIN; background(); calibrationHyperbolae(); lightCone(true); unprimedAxes();
  primedAxes(beta, C.red);
  var L0 = 4, g = gamma(beta);
  // rod at rest in O: endpoint world lines x = 0 and x = L0
  line(W(0, view.Tlo), W(0, 7.0), C.green, 5); line(W(L0, view.Tlo), W(L0, 7.0), C.green, 5);
  text('rod endpoint world lines', W(L0/2, 6.6), C.green, 13, 'center');
  line(W(0, -0.05), W(L0, -0.05), C.orange, 3);
  mtext(ctx, W(L0/2, 0).x, W(0, -0.5).y, 'L', null, '∗', 23, C.orange, 'center');
  // an O'-simultaneous pair of rod-end events, centred at ct = 3 so it stays on screen for every beta
  var t0 = 3 - 0.5*L0*beta, A = W(0, t0), B = W(L0, t0 + L0*beta);
  ctx.save(); boxClip();
  var rr = clipRange(0, t0, 1, beta); line(W(rr[0], t0 + rr[0]*beta), W(rr[1], t0 + rr[1]*beta), C.blue, 1.2, [5,5]);
  ctx.restore();
  line(A, B, C.blue, 5);
  var sx = norm(W(1, beta), W(0,0));
  for(var k=1; k*g <= L0 + 1e-9; k++){ tickAt(W(k*g, t0 + k*g*beta), sx, C.blue, 8, String(k), -21); }
  dot(A, C.blue, 6); dot(B, C.blue, 6);
  text('events simultaneous in O′', {x:B.x + 14, y:B.y - 2}, C.blue, 13);
  lightConeLabel();
  set('bgam', f3(g)); set('bth', f3(Math.atanh(beta))); set('bLL', f3(1/g)); set('bLp', f3(L0/g));
  set('btick', f3(g));
}
function buildBoost(){
  controls.innerHTML = '<h2>Lorentz boost</h2>' +
    '<div class="ctl"><label>β = v/c <span class="val" id="bv"></span></label>' +
    '<input id="br" type="range" min="-0.90" max="0.90" step="0.01"></div>' +
    '<div class="btnrow"><button class="btn primary" id="play">▶ Play sweep</button></div>' +
    '<div class="readout">' +
    '<span>γ</span><span class="v" id="bgam"></span><span>rapidity θ = atanh β</span><span class="v" id="bth"></span>' +
    '<span>measured length L in O′ (L<sup>∗</sup> = 4)</span><span class="v" id="bLp"></span>' +
    '<span>L / L<sup>∗</sup> = 1/γ</span><span class="v" id="bLL"></span>' +
    '<span>ct at the ct′ = 1 tick</span><span class="v" id="btick"></span></div>';
  bindBeta(); bindPlay();
  promptEl.textContent = 'Press Play: the primed axes scissor toward the light cone. Count blue ticks along the O′-simultaneous rod: it is L*/γ long in O′.';
  hintEl.textContent = 'Green lines: rod ends at rest in O. Blue ticks: unit steps of x′. The ct′ = 1 tick sits at ct = γ, so the moving clock ticks late in O.';
  eqEl.innerHTML = 't′ = γ(t − vx/c²), &nbsp; x′ = γ(x − vt), &nbsp; L = L<sup>∗</sup>/γ';
}

// ---------- tab 3: twins ----------
function aliceX(t){ return t <= T/2 ? bTwin*t : bTwin*(T - t); }
// Bob's time on Alice's line of simultaneity through her event at coordinate time t
function bobOnAliceNow(t){ var b = bTwin; return t <= T/2 ? t*(1 - b*b) : t + b*b*(T - t); }
function drawTwin(){
  view = VIEW_MAIN; background(); lightCone(false); unprimedAxes();
  var b = bTwin, g = gamma(b), tTurn = T/2, xTurn = b*tTurn;
  var tOut = bobOnAliceNow(tTurn - 1e-9), tIn = bobOnAliceNow(tTurn + 1e-9);   // T/(2g^2), T(1+b^2)/2
  // faint simultaneity lines from every tick of Alice's clock
  for(var k=1; k*g < T - 1e-9; k++){
    var ta = k*g; line(W(aliceX(ta), ta), W(0, bobOnAliceNow(ta)), 'rgba(46,125,87,0.35)', 1.2, [4,4]);
  }
  // the two turnaround simultaneity lines and the skipped stretch of Bob's world line
  line(W(xTurn, tTurn), W(0, tOut), C.green, 1.6, [6,4]);
  line(W(xTurn, tTurn), W(0, tIn), C.green, 1.6, [6,4]);
  // full world lines (faint) and the part already travelled (bold)
  line(W(0,0), W(0,T), 'rgba(15,110,147,0.25)', 5);
  line(W(0,0), W(xTurn,tTurn), 'rgba(46,125,87,0.25)', 5); line(W(xTurn,tTurn), W(0,T), 'rgba(46,125,87,0.25)', 5);
  line(W(0, tOut), W(0, tIn), C.orange, 8);
  text('skipped by Alice’s “now” at turnaround:', {x:W(0,0).x - 14, y:W(0,(tOut + tIn)/2).y - 12}, C.orange, 12.5, 'right');
  text('Δt = β²T = ' + f2(b*b*T), {x:W(0,0).x - 14, y:W(0,(tOut + tIn)/2).y + 12}, C.orange, 12.5, 'right', '700');
  line(W(0,0), W(0,tc), C.blue, 5);
  if(tc <= tTurn) line(W(0,0), W(aliceX(tc), tc), C.green, 5);
  else { line(W(0,0), W(xTurn,tTurn), C.green, 5); line(W(xTurn,tTurn), W(aliceX(tc), tc), C.green, 5); }
  // proper-time ticks: Bob every dt = 1, Alice every dt = gamma
  var vert = {x:0, y:-1};
  for(var j=1; j<=T; j++) tickAt(W(0,j), vert, C.blue, 7, '', 0);
  for(var m=1; m*g <= T + 1e-9; m++){
    var tm = m*g, dir = tm <= tTurn ? norm(W(b,1), W(0,0)) : norm(W(-b,1), W(0,0));
    tickAt(W(aliceX(tm), tm), dir, C.green, 7, '', 0);
  }
  // Alice's present line of simultaneity
  var tb = bobOnAliceNow(tc);
  if(tc > 0 && tc < T) line(W(aliceX(tc), tc), W(0, tb), C.green, 2.2);
  if(tc > 0 && tc < T) dot(W(0, tb), C.green, 5);
  dot(W(0,0), C.ink, 5); dot(W(0,T), C.ink, 5);
  var PB = W(0, tc), PA = W(aliceX(tc), tc);
  dot(PB, C.blue, 8, true); dot(PA, C.green, 8, true);
  // Bob's label left of his line, Alice's right of hers, vertically separated
  var midJ = (tOut + tIn)/2, dyB = Math.abs(tc - midJ) < 0.6 ? (tc >= midJ ? -40 : 40) : -16;
  if(tc > T - 0.4) dyB = 18;
  text('Bob  τ = ' + f2(tc), {x:PB.x - 16, y:PB.y + dyB}, C.blue, 14, 'right', '700');
  text('Alice  τ = ' + f2(tc/g), {x:PA.x + 16, y:PA.y + 18}, C.green, 14, 'left', '700');
  set('tg', f3(g)); set('tB', f3(T)); set('tA', f3(T/g)); set('tR', f3(1/g));
  set('tJ', f3(b*b*T)); set('tnow', f2(tb)); set('tbv', b.toFixed(2)); set('ttv', tc.toFixed(2));
  var ts = document.getElementById('tt'); if(ts && document.activeElement !== ts) ts.value = tc;
}
function buildTwin(){
  controls.innerHTML = '<h2>Twin trip</h2>' +
    '<div class="ctl"><label>Alice’s speed |β| <span class="val" id="tbv"></span></label>' +
    '<input id="tr" type="range" min="0.05" max="0.90" step="0.01"></div>' +
    '<div class="ctl"><label>Bob’s time ct <span class="val" id="ttv"></span></label>' +
    '<input id="tt" type="range" min="0" max="' + T + '" step="0.01"></div>' +
    '<div class="btnrow"><button class="btn primary" id="play">▶ Play</button><button class="btn" id="reset">Reset</button></div>' +
    '<div class="readout">' +
    '<span>γ</span><span class="v" id="tg"></span>' +
    '<span>Δτ<sub>Bob</sub></span><span class="v" id="tB"></span><span>Δτ<sub>Alice</sub></span><span class="v" id="tA"></span>' +
    '<span>ratio 1/γ</span><span class="v" id="tR"></span>' +
    '<span>Bob’s clock on Alice’s “now”</span><span class="v" id="tnow"></span>' +
    '<span>jump at turnaround β²T</span><span class="v" id="tJ"></span></div>';
  var tr = document.getElementById('tr'); tr.value = bTwin;
  tr.oninput = function(){ bTwin = +tr.value; draw(); };
  var tt = document.getElementById('tt'); tt.value = tc;
  tt.oninput = function(){ stopPlay(); tc = +tt.value; draw(); };
  document.getElementById('reset').onclick = function(){ stopPlay(); tc = 0; draw(); };
  bindPlay();
  promptEl.textContent = 'Press Play. Ticks mark each unit of proper time; Alice’s are γ apart in ct, so she returns younger.';
  hintEl.textContent = 'Dashed green: Alice’s lines of simultaneity. On each leg Bob’s clock runs slow for her too; at the turnaround her “now” jumps across the orange stretch, β²T. That jump is the asymmetry. (1 unit of Bob’s time per second.)';
  eqEl.innerHTML = 'Δτ<sub>Bob</sub> = T, &nbsp; Δτ<sub>Alice</sub> = T/γ, &nbsp; T/γ² + β²T = T';
}

// ---------- tab 4: rapidity ----------
function hypPt(e){ return [Math.sinh(e), Math.cosh(e)]; }
function drawVelocity(){
  view = VIEW_VEL; background(); lightCone(false); unprimedAxes();
  var th = Math.atanh(clamp(vx, -0.999, 0.999)), ph = Math.atanh(clamp(V, -0.999, 0.999)), d = th - ph;
  var vxp = (vx - V)/(1 - vx*V);
  ctx.save(); boxClip();
  // sector between the boost's ray (phi) and the object's ray (theta): area (theta - phi)/2
  ctx.beginPath(); var o = W(0,0); ctx.moveTo(o.x, o.y);
  var n = 80;
  for(var i=0;i<=n;i++){ var e = ph + (th - ph)*i/n, p = hypPt(e), s = W(p[0], p[1]); ctx.lineTo(s.x, s.y); }
  ctx.closePath(); ctx.fillStyle = 'rgba(15,110,147,0.16)'; ctx.fill();
  // unit hyperbola and the boost frame's axes
  var pts = []; for(var e2=-3; e2<=3.0001; e2+=0.01) pts.push(hypPt(e2));
  polyline(pts, C.ink, 2.4);
  var rx = clipRange(0, 0, Math.cosh(ph), Math.sinh(ph));
  line(W(rx[0]*Math.cosh(ph), rx[0]*Math.sinh(ph)), W(rx[1]*Math.cosh(ph), rx[1]*Math.sinh(ph)), 'rgba(164,59,52,0.55)', 1.6, [7,5]);
  var rt = clipRange(0, 0, Math.sinh(ph), Math.cosh(ph));
  line(W(0,0), W(rt[1]*Math.sinh(ph), rt[1]*Math.cosh(ph)), 'rgba(164,59,52,0.55)', 1.6, [7,5]);
  ctx.restore();
  var U = hypPt(th), Vb = hypPt(ph), Up = hypPt(d);
  arrow(W(0,0), W(Vb[0], Vb[1]), C.red, 3); arrow(W(0,0), W(U[0], U[1]), C.green, 3.4);
  dot(W(Vb[0], Vb[1]), C.red, 6, true); dot(W(U[0], U[1]), C.green, 7, true);
  var pV = W(Vb[0], Vb[1]), pU = W(U[0], U[1]);
  // point labels: the larger-rapidity point is labelled to its right, the smaller to its left,
  // each nudged below the curve (convex side) so neither sits on the hyperbola or the sector
  var uRight = th >= ph;
  text('object, θ', {x:pU.x + (uRight ? 16 : -16), y:pU.y + 20}, C.green, 13, uRight ? 'left' : 'right', '600');
  text('O′ (boost), φ', {x:pV.x + (uRight ? -16 : 16), y:pV.y + 20}, C.red, 13, uRight ? 'right' : 'left', '600');
  // the same 4-velocity after boosting to O': slide along the hyperbola by -phi
  if(inBox(Up[0], Up[1])){
    var pp = W(Up[0], Up[1]);
    ctx.save(); ctx.strokeStyle = C.blue; ctx.lineWidth = 2.4; ctx.beginPath(); ctx.arc(pp.x, pp.y, 8, 0, 2*Math.PI); ctx.stroke(); ctx.restore();
    var arc = []; for(var k=0;k<=40;k++) arc.push(hypPt(th - ph*k/40).map(function(v){ return v*1.08; }));
    polyline(arc, 'rgba(15,110,147,0.7)', 1.4, [3,4]);
    text('same U in O′: θ − φ', {x:pp.x + (uRight ? -12 : 12), y:pp.y - 38}, C.blue, 13, uRight ? 'right' : 'left', '600');   // concave side, above the curve
  } else {
    text('in O′: rapidity θ − φ = ' + f2(d) + ' (off this diagram)', W(0, view.Thi - 0.3), C.blue, 13, 'center', '600');
  }
  // area label outside the sector, on a leader line from its middle
  if(Math.abs(d) > 0.06){
    var m = (th + ph)/2, mid = hypPt(m), anc = W(mid[0]*0.55, mid[1]*0.55);
    var nx = Math.cosh(m), nt = -Math.sinh(m), nl = Math.hypot(nx, nt);
    var tip = W(mid[0]*0.55 + 1.25*nx/nl, mid[1]*0.55 + 1.25*nt/nl);
    line(anc, tip, C.blue, 1.2); dot(anc, C.blue, 3);
    text('sector area = (θ − φ)/2', {x:tip.x + 6, y:tip.y}, C.blue, 13, 'left', '600');
  }
  // hyperbola label on the far-left branch, just below the curve
  var hl = hypPt(-1.0), ph2 = W(hl[0] - 0.15, hl[1] - 0.38);
  text('unit hyperbola (ct)² − x² = 1', ph2, C.ink, 13, 'right');
  set('vbx', vx.toFixed(2)); set('vbv', V.toFixed(2));
  set('vxp', f3(vxp)); set('vth', f3(th)); set('vph', f3(ph)); set('vd', f3(d)); set('vtd', f3(Math.tanh(d)));
}
function buildVelocity(){
  controls.innerHTML = '<h2>Velocity transform</h2>' +
    '<div class="ctl"><label>object β<sub>x</sub> = v<sub>x</sub>/c in O <span class="val" id="vbx"></span></label>' +
    '<input id="vx" type="range" min="-0.95" max="0.95" step="0.01"></div>' +
    '<div class="ctl"><label>boost β<sub>V</sub> = V/c <span class="val" id="vbv"></span></label>' +
    '<input id="vv" type="range" min="-0.90" max="0.90" step="0.01"></div>' +
    '<div class="readout">' +
    '<span>β<sub>x</sub>′ (velocity addition)</span><span class="v" id="vxp"></span>' +
    '<span>θ = atanh β<sub>x</sub></span><span class="v" id="vth"></span><span>φ = atanh β<sub>V</sub></span><span class="v" id="vph"></span>' +
    '<span>θ − φ</span><span class="v" id="vd"></span><span>tanh(θ − φ)</span><span class="v" id="vtd"></span></div>';
  var a = document.getElementById('vx'), b = document.getElementById('vv');
  a.value = vx; b.value = V;
  a.oninput = function(){ vx = +a.value; draw(); };
  b.oninput = function(){ V = +b.value; draw(); };
  promptEl.textContent = 'Every 4-velocity lies on the unit hyperbola. A boost slides each point along it by the same hyperbolic angle φ, so rapidities subtract: tanh(θ − φ) = β′.';
  hintEl.innerHTML = 'Rapidity is twice the hyperbolic-sector area from the ct axis. Set β<sub>x</sub> = β<sub>V</sub> and the object is at rest in O′. (Larger scale than the other tabs.)';
  eqEl.innerHTML = 'β<sub>x</sub>′ = (β<sub>x</sub> − β<sub>V</sub>)/(1 − β<sub>x</sub>β<sub>V</sub>) = tanh(θ − φ)';
}

// ---------- plumbing ----------
function set(id, v){ var e = document.getElementById(id); if(e) e.textContent = v; }
function bindBeta(){
  var br = document.getElementById('br'); br.value = beta;
  br.oninput = function(){ stopPlay(); beta = +br.value; draw(); };
}
function syncBeta(){
  set('bv', beta.toFixed(2));
  var br = document.getElementById('br'); if(br && document.activeElement !== br) br.value = beta;
}
function bindPlay(){
  var pb = document.getElementById('play');
  pb.onclick = function(){ if(playing) stopPlay(); else startPlay(); };
  updatePlay();
}
function updatePlay(){
  var pb = document.getElementById('play'); if(!pb) return;
  var idle = mode === 'boost' ? '▶ Play sweep' : (tc >= T ? '↻ Replay' : '▶ Play');
  pb.textContent = playing ? '❚❚ Pause' : idle;
}
function startPlay(){
  if(mode === 'twin' && tc >= T) tc = 0;
  if(mode === 'boost') phase = Math.asin(clamp(beta/0.85, -1, 1));
  playing = true; lastNow = performance.now();
  if(!anim) anim = requestAnimationFrame(step);
  updatePlay();
}
function stopPlay(){ playing = false; if(anim) cancelAnimationFrame(anim); anim = null; updatePlay(); }
function step(now){
  var dt = Math.min(0.05, (now - lastNow)/1000); lastNow = now;
  if(mode === 'boost'){ phase += dt*2*Math.PI/8; beta = 0.85*Math.sin(phase); }
  else if(mode === 'twin'){ tc = Math.min(T, tc + dt); if(tc >= T) playing = false; }
  else playing = false;
  draw();
  if(playing) anim = requestAnimationFrame(step); else { anim = null; updatePlay(); }
}
function draw(){
  if(mode === 'interval') drawInterval();
  else if(mode === 'boost') drawBoost();
  else if(mode === 'twin') drawTwin();
  else drawVelocity();
  syncBeta();
}
function build(){
  if(mode === 'interval') buildInterval();
  else if(mode === 'boost') buildBoost();
  else if(mode === 'twin') buildTwin();
  else buildVelocity();
  draw();
}

function logical(e){
  var r = canvas.getBoundingClientRect();
  return inv((e.clientX - r.left)*LW/r.width, (e.clientY - r.top)*LH/r.height);
}
canvas.addEventListener('pointerdown', function(e){
  if(mode !== 'interval') return;
  var p = logical(e);
  if(Math.hypot(p.x - q.x, p.t - q.t) < 0.45){ dragging = true; canvas.setPointerCapture(e.pointerId); canvas.style.cursor = 'grabbing'; }
});
canvas.addEventListener('pointermove', function(e){
  var p = logical(e);
  if(!dragging){
    canvas.style.cursor = (mode === 'interval' && Math.hypot(p.x - q.x, p.t - q.t) < 0.45) ? 'grab' : 'default';
    return;
  }
  q.x = clamp(p.x, -6.5, 6.5); q.t = clamp(p.t, 0.05, 6.8); draw();
});
function endDrag(){ dragging = false; canvas.style.cursor = 'default'; }
canvas.addEventListener('pointerup', endDrag); canvas.addEventListener('pointercancel', endDrag);

document.querySelectorAll('.tabs button').forEach(function(b){
  b.onclick = function(){
    stopPlay();
    document.querySelectorAll('.tabs button').forEach(function(x){ x.classList.remove('active'); });
    b.classList.add('active'); mode = b.dataset.mode; build();
  };
});
build();

// Crop check (logical y must stay within 85..750):
//  main view: box t in [-1.5, 7.2] -> y in [101, 728]; axis label at t = 7.3 -> y = 94.
//  velocity view: box t in [-0.8, 4.0] -> y in [100, 724].
//  Everything drawn in the box is clipped to it; labels outside the box are the axis names only.
})();
</script>
